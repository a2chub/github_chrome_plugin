<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Dashboard Customizer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img
          src="../assets/icons/icon48.png"
          alt="GitHub Dashboard Customizer"
          width="24"
          height="24"
        />
        <div class="popup__title">
          <strong>GitHub Dashboard Customizer</strong>
          <span class="popup__subtitle">クイックアクション</span>
        </div>
      </header>

      <section class="popup__actions">
        <button id="open-settings" class="popup__button">
          <span>設定を開く</span>
        </button>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
